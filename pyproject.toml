[project]
name = "readcoach"
version = "0.0.0"
description = "Eval-first AI reading-tutor harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0.2",
    "jiwer>=3.0",
    "fsrs>=4.0",
    "weave>=0.51",
    "wandb>=0.17",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "datasets>=2.20",
    "soundfile>=0.12",
    "librosa>=0.10",
    "streamlit>=1.36",
    "pydantic>=2.7",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readcoach"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff",
]
fit = [
    "pyBKT>=1.4,<1.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
