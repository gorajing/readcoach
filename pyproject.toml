[project]
name = "readcoach"
version = "0.0.0"
description = "Eval-first AI reading-tutor harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0.2",
    "jiwer>=3.0",
    "fsrs>=4.0",
    "weave>=0.51",
    "wandb>=0.17",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "datasets>=2.20",
    "soundfile>=0.12",
    "librosa>=0.10",
    "streamlit>=1.36",
    "pydantic>=2.7",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.scripts]
readcoach-bench = "readcoach.bench_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readcoach"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Add the project root so that the top-level `evals` package is importable
# alongside the installed `readcoach` package (pytest 7+ pythonpath feature).
pythonpath = ["."]
markers = [
    "network: hits the public internet (deselected by default)",
]
addopts = "-m 'not network'"
