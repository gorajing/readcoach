# ReadCoach pedagogy invariants — INVARIANTS AS DATA (T4.3).
#
# Each rule carries the VERBATIM policy sentence it implements and the source it
# came from, so the executable check is traceable to a stated commitment rather
# than to a programmer's memory.  The compiler (src/readcoach/policy_compiler.py)
# turns each `check` block into a named, executable check over a SessionTrace
# that emits severity-tagged Findings.
#
# These pedagogy rules cite OUR OWN architecture document (docs/ARCHITECTURE.md):
# the verbatim_sentence is copied EXACTLY from that file.  Safety rules that must
# cite an external published policy live in policies/safety.yaml.
#
# Rule schema (validated, fail-loud, in policy_compiler.load_policies):
#   id                : unique, stable check id (matches a compiler-known type)
#   severity          : error | warning   (error -> counts toward gated violations)
#   verbatim_sentence : the EXACT sentence the check implements (never fabricated)
#   source:
#     name : human-readable source name
#     url  : resolvable URL or repo-relative path
#     accessed : ISO date the sentence was copied
#   check:
#     type   : compiler-known check type (== id here for the named checks)
#     params : machine parameters for the check

policy_set: pedagogy
version: "1.0"

rules:
  - id: never_says_wrong
    severity: error
    verbatim_sentence: >-
      never says "wrong"
    source:
      name: "ReadCoach Architecture — policies/ invariant compiler"
      url: "docs/ARCHITECTURE.md"
      accessed: "2026-06-10"
    check:
      type: never_says_wrong
      params:
        # Word-bounded, case-insensitive lexicon.  DOCUMENTED necessary-not-
        # sufficient: hitting any of these is sufficient to FLAG, but an
        # utterance can demoralize without any of them (a judge-graded
        # extension is the planned superset — see no_emotional_intimacy).
        lexicon:
          - wrong
          - incorrect
          - "no!"
          - "nope"
          - bad
          - mistake
          - "that's not right"
          - "not right"
    notes: >-
      Necessary-not-sufficient lexicon gate.  The verbatim phrase is the
      shorthand the architecture doc uses for the motivation-protection
      invariant; the operationalization (the specific lexicon + word-bounding)
      is ours.

  - id: never_coaches_mid_page
    severity: error
    verbatim_sentence: >-
      Coaching happens at page-end, not mid-page; productive struggle is
      protected
    source:
      name: "ReadCoach Architecture — tutor.py + planner.py, the decision loop"
      url: "docs/ARCHITECTURE.md"
      accessed: "2026-06-10"
    check:
      type: never_coaches_mid_page
      params:
        # Coaching moves are page-end-only.  Seeing any of these on a turn that
        # is NOT at_page_end is a violation.  Additionally, when a turn has no
        # action taxonomy (action_move is None, e.g. a free-text emitter), a
        # substantive (non-empty) utterance on a mid-page turn counts as coaching
        # — utterance presence counts as coaching when no action taxonomy exists.
        coaching_moves:
          - ENCOURAGE
          - COMPREHENSION_PROMPT
          - NEXT_ITEM

  - id: never_corrects_self_correction
    severity: error
    verbatim_sentence: >-
      self-corrections are never "corrected."
    source:
      name: "ReadCoach Architecture — tutor.py + planner.py, the decision loop"
      url: "docs/ARCHITECTURE.md"
      accessed: "2026-06-10"
    check:
      type: never_corrects_self_correction
      params:
        # A self_correction turn must not be met with a corrective move, nor an
        # utterance that hits the corrective lexicon.
        corrective_moves:
          - SCAFFOLDED_HINT
          - MODEL_THE_WORD
        corrective_lexicon:
          - "actually it's"
          - "the word is"
          - "try again"
          - "let's fix"
          - "that was wrong"

  - id: never_reserves_completed_item
    severity: error
    verbatim_sentence: >-
      Completed items are never re-served without review intent.
    source:
      name: "ReadCoach Architecture — tutor.py + planner.py, the Quest planner"
      url: "docs/ARCHITECTURE.md"
      accessed: "2026-06-10"
    check:
      type: never_reserves_completed_item
      params:
        # A turn that serves a skill as NEW (served_reason == "new") is a
        # violation when that skill was ALREADY completed — either it was in
        # SessionTrace.completed_skills_at_start, or an earlier turn in this same
        # trace already served it.  Re-serving as "review" is always fine
        # (review intent), so only served_reason == "new" is policed.
        new_reason: new
