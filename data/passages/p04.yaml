band: 2
phonics_focus: Initial blends (fr, tr, sn, gl, pl) and final blends (nd, nt, st, mp); the digraph ck.
text: >-
  Frank ran fast to catch the truck. He must not be late for the trip. He
  packed a snack and a thick jacket in his pack. The bus went past the
  pond and the tall plant. Frank felt glad and held the rail.
