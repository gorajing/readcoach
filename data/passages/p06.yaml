id: p06
band: 3
phonics_focus: Vowel teams (ai, ea, oa, ee) for long-vowel sounds.
text: >-
  The team set sail on a boat at dawn. The sea was green and the cool air
  felt clean. Jean kept the rope near her feet. A seal swam by and gave a
  squeal. They reached the beach and ate a meal of sweet peach.
