id: p07
band: 4
phonics_focus: R-controlled vowels (ar, or, er, ir, ur) in two-syllable words.
text: >-
  The farmer parked his cart near the barn before the storm. His sister
  Marta turned the corner with a basket of corn. The thunder was louder
  than a horn. A nervous bird hid under the porch. After the storm they
  shared warm corn for supper.
