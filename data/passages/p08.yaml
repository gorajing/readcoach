id: p08
band: 4
phonics_focus: Multisyllable words with common suffixes and r-controlled vowels.
text: >-
  The garden behind the market was open every morning. A gardener named
  Carter planted yellow flowers in tidy rows. Children gathered to wander
  and water the plants together. A rabbit hopped under the corner basket.
  Carter smiled and offered them a sweet purple turnip.
